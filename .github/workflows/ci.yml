name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: pip install flake8
      - name: Hard gate (syntax errors and undefined names)
        run: |
          flake8 --select=E9,F63,F7,F82 --extend-select= \
              src studies tests docs
      - name: Full style report (informational)
        run: flake8 src studies tests docs || true

  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install ".[test]"
      - name: Run cross-implementation regression tests
        run: python -m pytest tests -q

  cpp:
    name: C++ build and CTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libfftw3-dev
      - name: Configure
        run: |
          cmake -S src/simulator_cpp -B src/simulator_cpp/build \
              -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build src/simulator_cpp/build -j
      - name: Test
        run: ctest --test-dir src/simulator_cpp/build --output-on-failure
