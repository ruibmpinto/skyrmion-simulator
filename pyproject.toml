[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrmion-simulator"
version = "1.0.0"
description = "Micromagnetic and stochastic LLGS simulator for skyrmions in single ferromagnetic layers and synthetic antiferromagnets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rui Barreira", email = "rbarreira@ethz.ch" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
]
keywords = ["micromagnetics", "skyrmions", "LLGS", "synthetic antiferromagnet",
            "spin-orbit torque"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/ruibmpinto/skyrmion-simulator"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skyrmion_simulator*"]
